name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      corpus_scale:
        description: Corpus scale for the real-model memory gate
        default: "1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    # The full suite takes ~10 minutes on the slowest runner; a hung test must
    # not burn the default 6-hour cap.
    timeout-minutes: 40
    steps: &test-steps
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - id: sync
        # The tui extra is what the installer wizard is written against, so the
        # checks need it too: without it the wizard's tests cannot import and
        # mypy cannot see the widgets they subclass.
        run: uv sync --all-groups --extra cpu --extra tui --locked
      # Cheap deterministic checks run first so a format or lint slip fails in
      # seconds instead of after the full test suite; every step still runs
      # (`!cancelled()`), so a red run reports all problems at once rather than
      # one per push. They skip when the environment itself could not be built,
      # where their output would only be noise.
      - name: Format
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run ruff format --check .
      - name: Lint
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run ruff check .
      - name: Types
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run mypy src
      - name: Types (scripts)
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run mypy scripts/benchmark_index_memory.py
      # The Godot grammars come from a GitHub release the pack downloads on
      # first use; every test worker resolving them concurrently turned a
      # transient release outage into four failed tests. Resolve the download
      # once, serialized and retried, before pytest starts: with the parsers
      # on disk the pack loads them without touching the network at all. The
      # cache dir is versioned by the pack itself, so a pack upgrade simply
      # misses and repopulates.
      - name: Locate the tree-sitter pack cache
        id: ts-pack
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        shell: bash
        run: |
          echo "dir=$(uv run python -c 'import tree_sitter_language_pack as p; print(p.cache_dir())')" >> "$GITHUB_OUTPUT"
          echo "version=$(uv run python -c 'from importlib.metadata import version; print(version("tree-sitter-language-pack"))')" >> "$GITHUB_OUTPUT"
      - name: Restore the tree-sitter pack cache
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        uses: actions/cache@v4
        with:
          path: ${{ steps.ts-pack.outputs.dir }}
          key: tree-sitter-pack-${{ runner.os }}-${{ steps.ts-pack.outputs.version }}
      - name: Populate the tree-sitter pack cache
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: >-
          uv run python -c
          "from code_indexing_mcp.extractor import _pack_language;
          [_pack_language(n) for n in ('gdscript', 'gdshader', 'godot_resource')]"
      - name: Test
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        # pytest-xdist shortens the suite ~2.6x on multi-core runners (locally
        # 225s -> 86s); the suite is worker-safe (tmp_path isolation).
        run: uv run pytest -n auto

  # macOS is the most expensive runner by far, and a developer with a Mac can
  # run these exact checks locally, so it no longer runs on every push. It is
  # kept as a manual-dispatch job for the rare case where a darwin-only
  # regression is suspected and worth paying for one run.
  test-macos:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    runs-on: macos-latest
    timeout-minutes: 40
    steps: *test-steps

  # The real-model memory gate downloads ~640 MB and takes minutes, so it is
  # manually dispatched rather than run on every push. Normal CI still checks
  # the acceptance criteria through the pure evaluate_result tests above.
  memory:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The model download plus benchmark at the dispatched corpus scale can run
    # long; cap it so a runaway corpus size cannot burn the default cap.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-groups --extra cpu --extra tui --locked
      - name: Restore the embedding model cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.model-cache
          key: code-indexing-mcp-model-jina-v2-base-code
      - name: Populate the model cache
        env:
          CODE_INDEXING_CACHE_DIR: ${{ github.workspace }}/.model-cache
        run: uv run code-indexing-mcp model pull
      - name: Locate the tree-sitter pack cache
        id: ts-pack
        shell: bash
        run: |
          echo "dir=$(uv run python -c 'import tree_sitter_language_pack as p; print(p.cache_dir())')" >> "$GITHUB_OUTPUT"
          echo "version=$(uv run python -c 'from importlib.metadata import version; print(version("tree-sitter-language-pack"))')" >> "$GITHUB_OUTPUT"
      - name: Restore the tree-sitter pack cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.ts-pack.outputs.dir }}
          key: tree-sitter-pack-${{ runner.os }}-${{ steps.ts-pack.outputs.version }}
      - name: Populate the tree-sitter pack cache
        run: >-
          uv run python -c
          "from code_indexing_mcp.extractor import _pack_language;
          [_pack_language(n) for n in ('gdscript', 'gdshader', 'godot_resource')]"
      - name: Run the memory gate
        env:
          CODE_INDEXING_MODEL_TEST_CACHE: ${{ github.workspace }}/.model-cache
        run: uv run pytest -q -m memory
      - name: Benchmark at the dispatched corpus scale
        if: always()
        run: |
          uv run python scripts/benchmark_index_memory.py \
            --corpus-scale "${{ inputs.corpus_scale }}" \
            --model-cache ${{ github.workspace }}/.model-cache \
            --offline \
            --output benchmark-memory.json
      - name: Upload the benchmark document
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-index-memory
          path: benchmark-memory.json
          if-no-files-found: warn
