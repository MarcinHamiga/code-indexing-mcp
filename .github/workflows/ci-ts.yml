name: CI (TypeScript)

# The second workflow §11 of the migration plan calls for: the same gates the
# Python tree has, applied to the TypeScript tree, from Phase 0 onward. Both
# suites run on every PR until cutover; this one is retired last.
on:
  # Restricted to main deliberately. A branch with an open PR would otherwise
  # match both events and run this whole matrix twice per commit -- which is
  # not only wasted minutes: twelve concurrent jobs fetching the same action
  # archive got the runners rate-limited (HTTP 429) at "Set up job", so the
  # duplication was failing Windows rather than merely doubling it.
  push:
    branches: [main]
    paths: &ts-paths
      - "ts/**"
      - ".github/workflows/ci-ts.yml"
      # The spikes and the Phase 2 suites read committed Python-tree files --
      # the query packs, the extractor corpus and its golden snapshot, and the
      # resolver corpus -- so a change to any of them can break this workflow
      # without touching ts/.
      - "src/code_indexing_mcp/queries/**"
      - "src/code_indexing_mcp/reference_queries/**"
      - "tests/fixtures/extractor_corpus/**"
      - "tests/fixtures/extractor_snapshot.json"
      - "tests/fixtures/resolver_corpus/**"
  pull_request:
    paths: *ts-paths
  workflow_dispatch:

# Superseded runs are cancelled: only the newest commit on a branch is worth
# spending three OSes on, and it keeps concurrent action downloads down.
concurrency:
  group: ci-ts-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ts

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned deliberately: Bun ships faster than Node LTS and the risk
          # register treats an unplanned upgrade as a real hazard. Move this
          # with the full suite as the gate, never incidentally.
          bun-version: 1.3.14
      - id: install
        # `--frozen-lockfile` is the `uv sync --locked` equivalent: CI must
        # install exactly what the committed bun.lock resolves to.
        run: bun install --frozen-lockfile

      # From Phase 2 the server package resolves `gdshader` through the language
      # pack, which fetches a grammar's shared library on first use -- so the
      # test job needs the same warm cache the spikes job does, for the same
      # reason the Python workflow warms its grammar cache. Windows is skipped:
      # the pack's binding cannot load there (§5.5), the scanner treats
      # `.gdshader` as an unsupported extension, and downloading a grammar
      # nothing will open would only add a way for the job to fail.
      - name: Locate the language-pack cache
        id: pack
        if: ${{ !cancelled() && steps.install.outcome == 'success' && runner.os != 'Windows' }}
        working-directory: ts/packages/server
        shell: bash
        run: |
          dir=$(bun -e 'console.log(require("@kreuzberg/tree-sitter-language-pack").cacheDir())') || dir=""
          echo "resolved to: ${dir:-<unresolved>}"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - name: Restore the language-pack cache
        # Caching is an optimization -- `download` fetches whatever is absent --
        # so a cache that cannot be located must not fail the suite it exists to
        # speed up.
        if: ${{ !cancelled() && steps.pack.outputs.dir != '' }}
        uses: actions/cache@v4
        with:
          path: ${{ steps.pack.outputs.dir }}
          key: ts-language-pack-${{ runner.os }}-${{ hashFiles('ts/bun.lock') }}
      - name: Populate the language-pack cache
        if: ${{ !cancelled() && steps.install.outcome == 'success' && runner.os != 'Windows' }}
        working-directory: ts/packages/server
        shell: bash
        run: bun -e 'require("@kreuzberg/tree-sitter-language-pack").download(["gdshader"])'

      # Cheap deterministic checks first, mirroring the Python workflow: a
      # format slip fails in seconds rather than after the suite. Every step
      # still runs on failure so one push reports every problem.
      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run format:check
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run lint
      - name: Types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # Bun executes TypeScript without checking it, so this is the only
        # thing standing where `mypy --strict` stands in the Python workflow.
        run: bun run typecheck
      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun test

  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Restore the embedding model cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/code-indexing-models
          key: ts-embedding-model-${{ runner.os }}-${{ hashFiles('ts/bun.lock') }}
      - name: Run the real-model memory gate
        env:
          CODE_INDEXING_EMBED_MEMORY_MB: "2048"
          CODE_INDEXING_MEMORY_CACHE: ${{ runner.temp }}/code-indexing-models
          CODE_INDEXING_MEMORY_REPORT: ${{ runner.temp }}/memory-report.json
        run: bun --cwd packages/server run memory:gate
      - name: Upload the memory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-memory-report
          path: ${{ runner.temp }}/memory-report.json
          if-no-files-found: warn

  # The Phase 0 spikes, as a regression gate on the bets the plan rests on: a
  # Bun release or a grammar republish that breaks native module loading should
  # fail here rather than in the middle of Phase 2.
  #
  # Only the spikes that need no external fixture run here. S1's Python-index
  # check and S3's vector-parity check skip without their fixtures, which the
  # harness reports as a skip rather than a pass.
  spikes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      # The language pack fetches a grammar's shared library on first use, the
      # same way the PyPI pack fetches the Godot grammars in the Python
      # workflow. Resolve it once, before the spikes run, so a transient outage
      # is one failed step rather than a failed language. The cache is
      # versioned by the pack itself, so a pack upgrade simply misses.
      - name: Locate the language-pack cache
        id: pack
        working-directory: ts/packages/spikes
        shell: bash
        run: |
          # Single quotes outside, double inside: the reverse nesting resolved
          # to an empty string on the Windows runner, and because `echo` still
          # succeeded the step passed while emitting `dir=`, which then failed
          # actions/cache with "Input required and not supplied: path".
          dir=$(bun -e 'console.log(require("@kreuzberg/tree-sitter-language-pack").cacheDir())') || dir=""
          echo "resolved to: ${dir:-<unresolved>}"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - name: Restore the language-pack cache
        # Caching is an optimization -- `download` fetches whatever is absent --
        # so a cache that cannot be located must not fail the job that the
        # spikes are the real test of.
        if: steps.pack.outputs.dir != ''
        uses: actions/cache@v4
        with:
          path: ${{ steps.pack.outputs.dir }}
          key: ts-language-pack-${{ runner.os }}-${{ hashFiles('ts/bun.lock') }}
      - name: Populate the language-pack cache
        working-directory: ts/packages/spikes
        shell: bash
        run: bun -e 'require("@kreuzberg/tree-sitter-language-pack").download(["gdshader"])'

      - name: Run the spikes
        working-directory: ts/packages/spikes
        run: bun run src/run.ts
      - name: Upload the spike reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-spike-reports-${{ matrix.os }}
          path: ts/packages/spikes/results/
          if-no-files-found: warn
