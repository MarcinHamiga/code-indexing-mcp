[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "incode-mcp"
version = "0.1.0"
description = "Local-only Tree-sitter code indexer exposed over MCP"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastembed>=0.7,<1",
    "filelock>=3.18,<4",
    "lancedb>=0.25,<1",
    "mcp>=1.27,<2",
    "pathspec>=0.12,<1",
    "platformdirs>=4.3,<5",
    "pyarrow>=20,<24",
    "pydantic>=2.11,<3",
    "tomli-w>=1.2,<2",
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-javascript>=0.23,<0.26",
    "tree-sitter-python>=0.23,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
]

[project.scripts]
incode = "incode_mcp.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "pytest-cov>=6.2,<8",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/incode_mcp"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["model: downloads and exercises the real embedding model"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["incode_mcp"]

[[tool.mypy.overrides]]
module = ["lancedb", "lancedb.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true
