[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-indexing-mcp"
version = "0.3.0"
description = "Local-only Tree-sitter code indexer exposed over MCP"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "filelock>=3.18,<4",
    "lancedb>=0.25,<1",
    "mcp>=1.27,<2",
    "pathspec>=0.12,<1",
    "platformdirs>=4.3,<5",
    "psutil>=7,<8",
    "pyarrow>=20,<24",
    "pydantic>=2.11,<3",
    "tomli-w>=1.2,<2",
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-java>=0.23,<0.24",
    "tree-sitter-javascript>=0.23,<0.26",
    "tree-sitter-python>=0.23,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
]

[project.optional-dependencies]
# Exactly one runtime extra belongs in any one environment. `fastembed` and
# `fastembed-gpu` install the same `fastembed` module over two different ONNX
# Runtime distributions that both own the `onnxruntime` import, so an
# environment holding both runs whichever landed last -- which is why uv is
# told below that they conflict, and why the accelerator gets an environment of
# its own rather than being added to the serving one.
cpu = ["fastembed>=0.7,<1"]
# The pinned CUDA support window for this release: ONNX Runtime 1.22-1.23,
# which builds against CUDA 12.x and cuDNN 9. onnxruntime-gpu is named
# explicitly rather than left to fastembed-gpu's much wider range so that the
# combination the installer probes is the combination this release was tested
# against. Wheels exist only for 64-bit Linux and Windows; every other platform
# resolves the extra to nothing and stays on CPU.
cuda = [
    "fastembed-gpu>=0.7,<1; (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
    "onnxruntime-gpu>=1.22,<1.24; (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
]
# ONNX Runtime's native WebGPU execution-provider plugin uses Metal on macOS,
# Vulkan on Linux, and Direct3D 12/Vulkan on Windows. Keep its runtime and
# plugin versions exact: this is the pair the installer probes before recording
# the environment as usable.
webgpu = [
    "huggingface-hub>=1,<2; (sys_platform == 'darwin' and (platform_machine == 'arm64' or platform_machine == 'x86_64')) or (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
    "numpy>=2,<3; (sys_platform == 'darwin' and (platform_machine == 'arm64' or platform_machine == 'x86_64')) or (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
    "onnxruntime==1.24.4; (sys_platform == 'darwin' and (platform_machine == 'arm64' or platform_machine == 'x86_64')) or (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
    "onnxruntime-ep-webgpu==0.1.0; (sys_platform == 'darwin' and (platform_machine == 'arm64' or platform_machine == 'x86_64')) or (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
    "tokenizers>=0.22,<1; (sys_platform == 'darwin' and (platform_machine == 'arm64' or platform_machine == 'x86_64')) or (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
]
# AMD publishes the tested MIGraphX build from its ROCm repository rather than
# PyPI. The installer nominates it only for this exact Python/ROCm matrix.
migraphx = [
    "huggingface-hub>=1,<2; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
    "numpy>=2,<3; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
    "onnxruntime-migraphx @ https://repo.radeon.com/rocm/manylinux/rocm-rel-7.2.1/onnxruntime_migraphx-1.23.2-cp312-cp312-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
    "tokenizers>=0.22,<1; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
]

[project.scripts]
code-indexing-mcp = "incode_mcp.cli:main"

[tool.hatch.metadata]
# MIGraphX is distributed as a versioned ROCm wheel URL rather than through a
# package index. The URL and its platform marker are locked above.
allow-direct-references = true

[tool.uv]
# One lockfile, four mutually exclusive resolutions. Each runtime distribution
# owns the same `onnxruntime` import, so no environment may combine them.
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda" },
        { extra = "webgpu" },
        { extra = "migraphx" },
    ],
]

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "pytest-cov>=6.2,<8",
    "ruff>=0.12,<1",
    "types-psutil>=7,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/incode_mcp"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["scripts"]
markers = [
    "accelerator: runs correctness and performance gates on a prepared accelerator runner",
    "model: downloads and exercises the real embedding model",
    "memory: runs the real-model indexing memory gate",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Extractor fixtures are input data, not project code. Their shapes are deliberate —
# the oversized line exists to drive the line-fragment path — and reformatting them
# would invalidate the committed output snapshot.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["incode_mcp"]

[[tool.mypy.overrides]]
module = ["lancedb", "lancedb.*", "onnxruntime", "onnxruntime.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true
